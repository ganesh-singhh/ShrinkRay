services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    container_name: shrinkray-backend
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - GIN_MODE=release
      - DOMAIN_NAME=http://cutshort.me
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", ""]
    environment:
      - ALLOW_EMPTY_PASSWORD=yes

  frontend:
    build:
      context: ./frontend
    container_name: shrinkray-frontend
    environment:
      - REACT_APP_API_URL=http://nginx:80  
      - DOMAIN_NAME=http://cutshort.me
    depends_on:
      - backend

  ngnix:
    image: nginx:latest
    container_name: ngnix
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

volumes:
  mongodb_data:
